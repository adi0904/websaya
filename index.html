<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Web Sederhana</title>
    <!-- Memuat Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Mengatur font Inter sebagai default */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-purple-200 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg text-center max-w-md w-full">
        <!-- Judul utama halaman -->
        <h1 id="greetingText" class="text-4xl font-bold text-gray-800 mb-6">Halo Dunia!</h1>

        <!-- Tombol interaktif untuk mengubah pesan -->
        <button id="changeTextBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75 mb-8">
            Ubah Pesan
        </button>

        <!-- Bagian baru untuk fitur Gemini API -->
        <div class="mt-8 pt-8 border-t border-gray-200">
            <h2 class="text-2xl font-bold text-gray-700 mb-4">✨ Hasilkan Teks Kreatif ✨</h2>
            <textarea id="promptInput" class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:ring-blue-500 focus:border-blue-500" rows="4" placeholder="Masukkan ide Anda di sini (misalnya: 'Cerita pendek tentang kucing yang bisa terbang')"></textarea>
            <button id="generateTextBtn" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-75">
                Hasilkan Teks
            </button>
            <div id="loadingIndicator" class="mt-4 text-gray-600 hidden">
                Memuat...
            </div>
            <div id="generatedTextOutput" class="mt-6 p-4 bg-gray-50 rounded-lg text-left text-gray-700 border border-gray-200 min-h-[100px] overflow-auto">
                Teks yang dihasilkan akan muncul di sini.
            </div>
        </div>
    </div>

    <script>
        // Mendapatkan elemen teks dan tombol dari DOM (bagian lama)
        const greetingText = document.getElementById('greetingText');
        const changeTextBtn = document.getElementById('changeTextBtn');

        // Menambahkan event listener ke tombol (bagian lama)
        changeTextBtn.addEventListener('click', () => {
            // Mengubah teks ketika tombol diklik
            if (greetingText.textContent === 'Halo Dunia!') {
                greetingText.textContent = 'Selamat Datang di Aplikasi Web Saya!';
            } else {
                greetingText.textContent = 'Halo Dunia!';
            }
        });

        // Mendapatkan elemen untuk fitur Gemini API (bagian baru)
        const promptInput = document.getElementById('promptInput');
        const generateTextBtn = document.getElementById('generateTextBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const generatedTextOutput = document.getElementById('generatedTextOutput');

        // Menambahkan event listener ke tombol "Hasilkan Teks"
        generateTextBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                generatedTextOutput.textContent = "Silakan masukkan ide untuk menghasilkan teks.";
                return;
            }

            // Tampilkan indikator loading
            loadingIndicator.classList.remove('hidden');
            generatedTextOutput.textContent = ''; // Bersihkan output sebelumnya

            try {
                let chatHistory = [];
                chatHistory.push({ role: "user", parts: [{ text: prompt }] });

                const payload = { contents: chatHistory };
                const apiKey = ""; // API key akan disediakan oleh lingkungan Canvas
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.candidates && result.candidates.length > 0 &&
                    result.candidates[0].content && result.candidates[0].content.parts &&
                    result.candidates[0].content.parts.length > 0) {
                    const text = result.candidates[0].content.parts[0].text;
                    generatedTextOutput.textContent = text;
                } else {
                    generatedTextOutput.textContent = "Maaf, tidak dapat menghasilkan teks. Coba lagi.";
                    console.error("Unexpected API response structure:", result);
                }
            } catch (error) {
                generatedTextOutput.textContent = "Terjadi kesalahan saat menghubungi API. Silakan coba lagi nanti.";
                console.error("Error calling Gemini API:", error);
            } finally {
                // Sembunyikan indikator loading
                loadingIndicator.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
